<!DOCTYPE html>
<html>
<head>
    <title>The Void</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; color: #0ff; font-family: 'Courier New', Courier, monospace; }
        #ui { position: absolute; top: 20px; left: 20px; font-size: 20px; text-shadow: 0 0 10px #0ff; }
        #msg { position: absolute; bottom: 20px; width: 100%; text-align: center; font-size: 18px; opacity: 0.7; }
    </style>
</head>
<body>
    <div id="ui">VOID DEPTH: <span id="score">0</span>m</div>
    <div id="msg">Use A and D to steer through the void...</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, tunnel, score = 0;
        let playerPos = 0;
        let targetPos = 0;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Create a neon tunnel
            const tunnelGeo = new THREE.CylinderGeometry(5, 5, 200, 32, 1, true);
            const tunnelMat = new THREE.MeshBasicMaterial({ 
                color: 0x00ffff, 
                wireframe: true, 
                side: THREE.BackSide 
            });
            tunnel = new THREE.Mesh(tunnelGeo, tunnelMat);
            tunnel.rotation.x = Math.PI / 2;
            scene.add(tunnel);

            // Adding some floating particles
            const particlesGeo = new THREE.BufferGeometry();
            const particlesCount = 1000;
            const posArray = new Float32Array(particlesCount * 3);
            for(let i=0; i<particlesCount*3; i++) {
                posArray[i] = (Math.random() - 0.5) * 100;
            }
            particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const particlesMat = new THREE.PointsMaterial({ size: 0.05, color: 0xff00ff });
            const particleMesh = new THREE.Points(particlesGeo, particlesMat);
            scene.add(particleMesh);

            camera.position.z = 5;

            window.addEventListener('keydown', (e) => {
                if(e.key === 'a' || e.key === 'A') targetPos -= 1;
                if(e.key === 'd' || e.key === 'D') targetPos += 1;
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);

            // Move tunnel to simulate forward motion
            tunnel.position.z += 0.5;
            if (tunnel.position.z > 100) tunnel.position.z = 0;

            // Smooth player movement
            playerPos += (targetPos - playerPos) * 0.1;
            camera.position.x = playerPos;
            camera.rotation.z = -playerPos * 0.1;

            score += 1;
            document.getElementById('score').innerText = Math.floor(score/10);

            // Pulse color
            tunnel.material.color.setHSL(Math.sin(Date.now() * 0.001) * 0.5 + 0.5, 1, 0.5);

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
